name: CI

on:
  push:
    branches: [main]
  pull_request:

# Phase 1 runs entirely offline: the deterministic rule provider is the default
# and Redis is replaced by the in-memory store / fakeredis, so no secrets needed.
jobs:
  core:
    name: Core (lint + tests + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyflakes

      - name: Lint (syntax + unused names)
        run: |
          python -m compileall -q core
          python -m pyflakes core

      - name: Tests
        run: python -m pytest

      - name: Validate contract mocks against schemas
        run: python -m core.lib.contracts

      - name: Import check for the ASGI app
        run: python -c "from core.main import app; print(app.title)"

  extension:
    name: Extension (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build loadable extension
        run: npm run build

      - name: Assert dist layout
        run: |
          test -f dist/manifest.json
          test -f dist/content.js
          test -f dist/background.js
          test -f dist/popup.html
          test -f dist/popup.js

  android:
    name: Android (form-core tests + debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Preinstalled on GitHub-hosted ubuntu runners
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform + build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: form-core unit tests (JVM, no emulator)
        run: gradle :form-core:test --console=plain

      - name: Compile debug APK
        run: gradle :app:assembleDebug --console=plain

  e2e:
    name: E2E (Playwright + extension, stub Core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            extensions/browser/package-lock.json
            tests/e2e/package-lock.json

      - name: Install extension deps + build dist
        working-directory: extensions/browser
        run: |
          npm ci
          npm run build

      - name: Install e2e deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E (5 repeats — INTE-001 acceptance)
        run: xvfb-run -a npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

