<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checkout — plain HTML</title>
  </head>
  <body>
    <h1>Checkout</h1>
    <form id="checkout" action="/order" method="post">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" value="" />

      <label for="name">Full name</label>
      <input id="name" name="name" type="text" />

      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="us">United States</option>
        <option value="ca">Canada</option>
      </select>

      <label>
        <input type="checkbox" name="terms" value="1" />
        I agree to the terms and conditions
      </label>

      <button type="submit" id="submit" name="step" value="billing">Submit billing</button>
      <button type="submit" name="step" value="shipping">Submit shipping</button>
    </form>
    <script>
      // Keep navigation out of the test; expose observable flags for QA/E2E.
      document.getElementById("checkout").addEventListener("submit", (e) => {
        e.preventDefault();
        document.body.dataset.submitted = String(Date.now());
      });
      document.getElementById("submit").addEventListener("click", () => {
        document.body.dataset.clicked = String(Date.now());
      });
    </script>
  </body>
</html>
